name: Build materials index

# Rebuilds docs/index.html automatically whenever a PDF is added/changed/removed
# under docs/materials/, or the build script itself changes. Also runnable by
# hand from the Actions tab (workflow_dispatch) to test it or force a rebuild.

on:
  push:
    branches: [main]
    paths:
      - "docs/materials/**"
      - "scripts/build_index.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Build index.html
        run: python scripts/build_index.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update materials index"
            git push
          fi
